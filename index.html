<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101322" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Study" />
  <meta name="description" content="Flashcards sem assinaturas: estude, importe baralhos Anki e revise no iPhone." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>Study — Seus flashcards no iPhone</title>
  <script defer src="jszip.min.js"></script>
  <script defer src="anki.js"></script>
  <script defer src="merge.js"></script>
  <script defer src="vault.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="brand-icon">S</div><div class="brand-copy"><strong>study<span class="dot">.</span></strong><small>FLASHCARDS PARA CONCURSOS</small></div></div>
    <button class="icon-btn" id="topAdd" aria-label="Novo flashcard" title="Novo flashcard">＋</button>
  </header>
  <main id="main" aria-live="polite"></main>
  <nav class="tabbar" aria-label="Navegação principal">
    <button type="button" class="tab active" data-tab="home"><span class="tabicon">⌂</span><span>Início</span></button>
    <button type="button" class="tab" data-tab="study"><span class="tabicon">▣</span><span>Estudar</span></button>
    <button type="button" class="tab" data-tab="decks"><span class="tabicon">▤</span><span>Baralhos</span></button>
    <button type="button" class="tab" data-tab="settings"><span class="tabicon">⚙</span><span>Ajustes</span></button>
  </nav>
</div>
<input type="file" id="filePicker" accept=".apkg,.colpkg,.txt,.tsv,.csv,.json,.study,text/plain,application/json" hidden />
<div id="vaultGate" class="vault-gate" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div class="modal-wrap" id="modalWrap" hidden><div class="modal-overlay" id="modalOverlay"></div><div class="modal" id="modalContent" role="dialog" aria-modal="true"></div></div>
</body>
</html>
